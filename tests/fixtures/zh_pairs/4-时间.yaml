# J2.14 第 4 类：时间。句子和名字都是编的，从头写的；source: report 的是任务说明里给的例句。
# 说话那天默认 2026-11-10（星期二），写了 day 的按 day。
# 该拦的要 G2、G6 拦（by；月日、几号、季度归 G2）。search 那几组按原文检索的统一写法（D77）。
# 一句里两个日期（T12 第 2 条）按开发说明 L4 的“三级”，窗口里有就算有，是写明的已知漏拦，标 beyond。
category: 时间
groups:
  - id: T01
    kind: l4
    source: report
    why: 下周三按说话那天换成 11 月 18 日
    lines: ["老韩：下周三交货。"]
    cases:
      - {text: "老韩 11 月 18 日交货", quote: "下周三交货", expect: pass}
      - {text: "老韩 11 月 19 日交货", quote: "下周三交货", expect: block, by: [G2, G6]}
  - id: T02
    kind: l4
    source: report
    why: 相对日期换算成 11/18 这种写法
    lines: ["老韩：下周三交货。"]
    cases:
      - {text: "老韩 11/18 交货", quote: "下周三交货", expect: pass}
      - {text: "老韩 11/19 交货", quote: "下周三交货", expect: block, by: [G2, G6]}
  - id: T03
