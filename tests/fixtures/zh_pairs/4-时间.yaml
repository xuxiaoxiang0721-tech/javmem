    subject: {name: 琴房租约, mention: 琴房租约, type: 订单或合同}
    attribute: 到期日期
    first: {line: "我：琴房租约的到期日期是 2026-11-18。", text: "琴房租约的到期日期是 2026-11-18", value: "2026-11-18"}
    cases:
      - {line: "我：琴房租约的到期日期是 11月18日。", text: "琴房租约的到期日期是 11月18日", value: "11月18日", expect: same}
      - {line: "我：琴房租约的到期日期是 2026/11/18。", text: "琴房租约的到期日期是 2026/11/18", value: "2026/11/18", expect: same}
      - {line: "我：琴房租约的到期日期是 11月19日。", text: "琴房租约的到期日期是 11月19日", value: "11月19日", expect: different}
