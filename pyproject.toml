[build-system]
# 装的时候照锁文件（requirements/build.in：84.2.1），这里只写范围；下面 license 写成 SPDX 的一个词（PEP 639）要 77 以上
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "javmem"
dynamic = ["version"]
description = "独立的记忆模块：记忆包进，查询接口出，不依赖任何 Bot 框架"
readme = "README.md"
requires-python = ">=3.12"
# 许可证 MIT（D26）。LICENSE 里的版权行写“javmem authors”（卡 4，主人 D229 定的）
license = "MIT"
license-files = ["LICENSE"]
# pdfminer.six 读附件里 PDF 的文字（D72，主人 11-10 选的），MIT；它带进来 charset-normalizer、cryptography
# jieba 给问话切词（J2.14），MIT，没有别的依赖。JioNLP 不用（D76：它必带 GPLv3 的 jiojio）
# 读附件里的 Excel、Word（D91），版本写死：openpyxl 读 .xlsx、.xlsm，MIT，带进来 et_xmlfile（MIT）；
# xlrd 读老的 .xls，BSD，没有别的依赖；python-docx 读 .docx，MIT，带进来 lxml（BSD-3-Clause）、typing_extensions（PSF-2.0）。
# 带进来的三个也写死
# 主图（J5.1）连 Neo4j 用官方的驱动 neo4j（Apache-2.0 和 Python-2.0），它带进来 pytz（MIT）。版本和支线（[side]）写死的一样，
# 两边一起装不打架。只有同步、查主图时才 import；没装、连不上都只当主图没开，不让写账失败
# 锁文件（U2 甲，D205 ⑩）：requirements/*.txt 照这里的范围、现在装着的版本生成，每个包带着每个文件的 sha256；装机、CI 都照锁文件装。
# 这里只写范围。改了这里（加包、改范围）要重新生成锁文件，见 docs/development.md“锁文件”
dependencies = [
    "PyYAML>=6.0,<7",
    "pdfminer.six>=20260107,<20270101",
    "jieba>=0.42.1,<0.43",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "python-docx==1.2.0",
    "et_xmlfile==2.0.0",
    "lxml==6.1.3",
    "typing_extensions==4.16.0",
    "neo4j==6.4.1",
    "pytz==2026.6",
]

[project.urls]
Homepage = "https://github.com/xuxiaoxiang0721-tech/javmem"
Repository = "https://github.com/xuxiaoxiang0721-tech/javmem"
Issues = "https://github.com/xuxiaoxiang0721-tech/javmem/issues"

[project.optional-dependencies]
dev = ["pytest>=9.2,<10"]
# 软变化判定调 Claude（J4.5，D20）：Anthropic 官方的 SDK，2.x 起是 Apache-2.0。只有真调时才 import，测试和 CI 用不着。
# 版本连同它带进来的都写死：anyio、h11、truststore、jiter、docstring_parser、pydantic、pydantic_core、annotated-types、
# typing-inspection 是 MIT；sniffio 是 MIT 或 Apache-2.0；httpx2、httpcore2、idna 是 BSD-3-Clause；opentelemetry-api 是 Apache-2.0
claude = [
    "anthropic==2.8.0",
    "anyio==4.16.0",
    "sniffio==1.3.1",
    "httpx2==2.16.1",
    "httpcore2==2.16.1",
    "h11==0.16.0",
    "idna==3.20",
    "truststore==0.10.5",
    "jiter==0.19.0",
    "docstring_parser==0.18.0",
    "opentelemetry-api==1.45.2",
    "pydantic==2.14.3",
    "pydantic_core==2.50.4",
    "annotated-types==0.8.0",
    "typing-inspection==0.4.5",
]
# Graphiti 支线（第 6 步，D144、D156）：graphiti-core 0.31.2，Apache-2.0。装在单独的 .venv-side 里，不装进大家共用的 .venv；
# 只有跑支线才 import，测试和 CI 用不着。版本连同它带进来的都写死，和上面 claude 重了的几个版本一样（两个一起装不打架）。
# graphiti-core 0.31.2 自己 import httpx 却没写进依赖（openai 3.x 改用 httpx2 了），所以另外点名 httpx、httpcore。
# 许可证：neo4j（驱动）是 Apache-2.0 和 Python-2.0；openai、tenacity、requests、distro 是 Apache-2.0；
# numpy 是 BSD-3-Clause 加 0BSD、MIT、Zlib、CC0-1.0；httpx、httpcore、httpx2、httpcore2、idna、python-dotenv 是 BSD-3-Clause；
# posthog、pydantic、pydantic_core、annotated-types、typing-inspection、anyio、jiter、truststore、h11、backoff、pytz、urllib3、
# charset-normalizer 是 MIT；sniffio 是 MIT 或 Apache-2.0；certifi 是 MPL-2.0（只用、不改）。
# posthog 是 Graphiti 的上报统计：支线在 import Graphiti 之前关掉，关了它连 posthog 都不 import（javmem.side.graph）
side = [
    "graphiti-core==0.31.2",
    "neo4j==6.4.1",
    "pytz==2026.6",
    "openai==3.51.0",
    "distro==1.9.0",
    "numpy==2.5.5",
    "tenacity==9.2.1",
    "posthog==7.91.2",
    "requests==2.34.2",
    "urllib3==2.8.0",
    "charset-normalizer==3.5.2",
    "backoff==2.2.1",
    "certifi==2026.10.23",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "anyio==4.16.0",
    "sniffio==1.3.1",
    "httpx2==2.16.1",
    "httpcore2==2.16.1",
    "h11==0.16.0",
    "idna==3.20",
    "truststore==0.10.5",
    "jiter==0.19.0",
    "pydantic==2.14.3",
    "pydantic_core==2.50.4",
    "annotated-types==0.8.0",
    "typing-inspection==0.4.5",
]

[project.scripts]
javmem = "javmem.cli:main"

[tool.setuptools.dynamic]
version = { attr = "javmem.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"javmem.ledger" = ["migrations/*.sql"]
"javmem.pipeline" = ["prompts/*.md"]
"javmem.graph" = ["triggers.sql"]
"javmem.drill" = ["poisons/*.yaml", "poisons/config/*.yaml", "poisons/packets/*/*.md"]  # 投毒演练编的毒包和诱饵清单（U2 乙）

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
